- Input Options:
    - infile:
        positional: True
        help: Input alignment file. Alignment file can be in SAM or BAM
          format.
    - filtered_bc:
        positional: True
        help: |
            Path to file containing filtered barcodes. Reads with cell 
            barcodes that are not in this list are excluded (tab-delimited 
            file with cell barcode in the first column).
    - filtered_bc_skip:
          type: int
          default: 0
          help: |
              Lines to skip in `filtered_bc`. (Set to 1 if `filtered_bc`
              has header).
    - nproc:
        default: 1
        type: int
        help: Number of cores to use.
    - tempdir:
        help: Path to temporary directory.

- Reporting Options:
    - logfile:
        type: str
        help: |
          Log messages to this file. If not provided, output messages will be
          written to <stderr>.
    - outfile:
        default: 'Aligned.sortedByCB.out.bam'
        help: File to write alignments to.
    - verbose:
        flag: 'v'
        action: 'count'
        default: 0
        help: Provide additional information about command processing.
